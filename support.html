<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TableGrab - Support</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#1e1e2e;color:#cdd6f4;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#181825;border:1px solid #313244;border-radius:16px;max-width:600px;width:100%;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.3)}
    .banner{background:linear-gradient(135deg,#1e1e2e,#313244);padding:40px 32px 32px;text-align:center}
    .banner-icon{font-size:48px;margin-bottom:12px}
    .banner h1{font-size:28px;margin-bottom:8px;background:linear-gradient(135deg,#4fc3f7,#a6e3a1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .banner p{color:#a6adc8;font-size:14px}
    .body{padding:28px 32px}
    .body h2{font-size:16px;color:#a6e3a1;margin-bottom:14px}
    .body ul{list-style:none;padding:0;margin-bottom:20px}
    .body li{padding:6px 0;font-size:14px;color:#bac2de;border-bottom:1px solid #1e1e2e}
    .body li:last-child{border-bottom:none}.body li::before{content:'✓ ';color:#a6e3a1}
    .thank{margin-top:20px}.thank p{font-size:14px;color:#bac2de;line-height:1.7;margin-bottom:10px}
    .heart{color:#f38ba8}
    .cta{text-align:center;padding:20px 32px 28px;border-top:1px solid #313244}
    .cta p{font-size:13px;color:#6c7086;margin-bottom:14px}
    .support-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:linear-gradient(135deg,#4fc3f7,#a6e3a1);color:#1e1e2e;border-radius:8px;font-size:15px;font-weight:600;text-decoration:none;transition:transform .15s,box-shadow .15s}
    .support-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(79,195,247,.3)}
    .footer{padding:16px 32px;text-align:center;font-size:12px;color:#6c7086;border-top:1px solid #1e1e2e}
    .footer a{color:#4fc3f7;text-decoration:none}.footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <div class="banner"><div class="banner-icon">📊</div><h1>TableGrab</h1><p data-i18n="tagline"></p></div>
    <div class="body">
      <h2 data-i18n="ft"></h2><ul id="fl"></ul>
      <h2 data-i18n="tt"></h2><div class="thank" id="tn"></div>
    </div>
    <div class="cta">
      <p data-i18n="ch"></p>
      <a class="support-btn" href="https://ko-fi.com/annmax?ref=tablegrab" target="_blank" rel="noopener"><img src="./assets/coffee.png" alt="" width="28" height="22" style="vertical-align:middle"> <span data-i18n="bt"></span></a>
    </div>
    <div class="footer"><a href="https://github.com/annmax1983/TableGrab" target="_blank" rel="noopener">GitHub</a> · <a href="https://annmax1983.github.io/TableGrab/privacy-policy.html" target="_blank" rel="noopener" data-i18n="pp">Privacy Policy</a> · © 2026 TableGrab</div>
  </div>
  <script>
    const I18N={zh:{tagline:'一键提取网页表格 · 轻量 · 隐私',ft:'✨ 功能特色',fl:['自动识别页面所有HTML表格','支持合并单元格(rowspan/colspan)导出','单表/多表/全表批量导出为CSV','UTF-8 BOM编码修复中文乱码','表格高亮预览，鼠标悬停定位','极简UI，三权限，零上传'],tt:'💌 想对你说',tn:['感谢你使用 TableGrab。做这个工具是因为受够了网页表格复制错乱、格式丢失的问题。','当然，如果你愿意请我喝一杯咖啡 <span class="heart">☕</span>，我会非常开心。'],ch:'点击下方按钮，跳转到支持页面',bt:'支持作者',pp:'隐私条款'},
      en:{tagline:'Extract Web Tables · Lightweight · Private',ft:'✨ Features',fl:['Auto-detect all HTML tables on page','Support merged cells (rowspan/colspan)','Single/multi/batch export as CSV','UTF-8 BOM fixes Chinese garbled','Table highlight on hover','Minimal UI,3 permissions, zero upload'],tt:'💌 A Note to You',tn:['Thank you for using TableGrab. I built this tool because I was tired of messy copy-paste from web tables.','If you\'d like to <span class="heart">☕</span> buy me a coffee, it would truly make my day.'],ch:'Click the button below to visit the support page',bt:'Support the Developer',pp:'Privacy Policy'},
      es:{tagline:'Extraer Tablas Web · Ligero · Privado',ft:'✨ Características',fl:['Auto-detectar todas las tablas HTML','Soporte celdas combinadas','Exportación por lotes como CSV','UTF-8 BOM para caracteres','Resaltar tabla al pasar el ratón','UI mínima,3 permisos, sin subida'],tt:'💌 Unas palabras',tn:['Gracias por usar TableGrab. Si quieres invitarme a un <span class="heart">☕</span> café, me haría muy feliz.'],ch:'Haz clic en el botón de abajo',bt:'Apoya al desarrollador',pp:'Política de Privacidad'},
      de:{tagline:'Web-Tabellen extrahieren · Leicht · Privat',ft:'✨ Funktionen',fl:['Alle HTML-Tabellen automatisch erkennen','Zusammengeführte Zellen unterstützen','Stapelexport als CSV','UTF-8 BOM für Zeichen','Tabelle bei Hover hervorheben','Minimales UI,3 Berechtigungen'],tt:'💌 Ein paar Worte',tn:['Vielen Dank, dass Sie TableGrab nutzen. Wenn Sie mir einen <span class="heart">☕</span> Kaffee ausgeben möchten, würde mich das freuen.'],ch:'Klicken Sie auf die Schaltfläche',bt:'Entwickler unterstützen',pp:'Datenschutzrichtlinie'},
      ja:{tagline:'Webテーブル抽出 · 軽量 · プライベート',ft:'✨ 機能',fl:['ページの全HTMLテーブルを自動検出','結合セル対応','一括CSVエクスポート','UTF-8 BOM文字化け修正','ホバーでテーブルハイライト','最小UI、3権限、ゼロアップロード'],tt:'💌 ご利用ありがとうございます',tn:['TableGrabをご利用いただきありがとうございます。コーヒーを <span class="heart">☕</span> 一杯おごっていただけると嬉しいです。'],ch:'下のボタンをクリック',bt:'開発者を支援',pp:'プライバシーポリシー'},
      fr:{tagline:'Extraire les Tableaux Web · Léger · Privé',ft:'✨ Fonctionnalités',fl:['Détection automatique de tous les tableaux','Cellules fusionnées prises en charge','Export par lot en CSV','UTF-8 BOM pour les caractères','Surbrillance au survol','UI minimale,3 permissions'],tt:'💌 Un petit mot',tn:['Merci d\'utiliser TableGrab. Si vous souhaitez m\'offrir un <span class="heart">☕</span> café, cela me ferait plaisir.'],ch:'Cliquez sur le bouton ci-dessous',bt:'Soutenir le développeur',pp:'Politique de Confidentialité'}
    };
    const code=(navigator.language||'en').split('-')[0].toLowerCase();const t=I18N[code]||I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k])el.textContent=t[k];});
    document.getElementById('fl').innerHTML=t.fl.map(f=>`<li>${f}</li>`).join('');
    document.getElementById('tn').innerHTML=t.tn.map(p=>`<p>${p}</p>`).join('');
    document.documentElement.lang=code;
  </script>
</body>
</html>
